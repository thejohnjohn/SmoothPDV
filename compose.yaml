name: smooth-pdv

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smooth-pdv}
      POSTGRES_USER: ${DB_USER:-smooth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smooth}
      LOAD_MOCKS: "true"
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/smooth-pdv-v2.sql:/opt/db/schema.sql:ro
      - ./database/mocks/v2/base-mocks-vw.sql:/opt/db/mocks.sql:ro
      - ./docker/postgres/init/00-init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smooth} -d ${DB_NAME:-smooth-pdv}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    command: ["sh", "-c", "yarn install --frozen-lockfile --non-interactive && exec node --watch src/server.js"]
    init: true
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smooth-pdv}
      DB_USER: ${DB_USER:-smooth}
      DB_PASSWORD: ${DB_PASSWORD:-smooth}
      JWT_SECRET: ${JWT_SECRET:-smooth-pdv-dev-secret}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-re_dev_placeholder}
      MAIL_FROM: "${MAIL_FROM:-SmoothPDV <dev@smoothpdv.local>}"
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["sh", "-c", "yarn install --frozen-lockfile --non-interactive && exec yarn dev"]
    init: true
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
